[package]
name = "t1-touchbar-hw"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
service = ["dep:t1-platform"]

[dependencies]
t1-platform = { path = "../t1-platform", version = "=0.0.0", optional = true, default-features = false, features = ["frame-memfd", "seqpacket", "system-brightness", "touchbar-drm", "touchbar-io", "touchbar-session"] }

[[bin]]
name = "t1-touchbar-hw"
path = "src/bin/t1-touchbar-hw.rs"
required-features = ["service"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
